<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 家　-->
      <a-box position="-1 1 -5" rotation="0 30 0" scale="2 2 2" color="#FFF5ee"></a-box>
      <a-cone position="-1 2.5 -5" scale="2 2 2" rotation="0 30 0" color="#a52a2a"></a-cone>
      <a-box position="-0.75 0 -4.5" rotation="0 30 0" scale="0.8 2.5 1" color="#d2b48c"></a-box>
      <a-cylinder position="-0.2 0.85 -3" rotation="90 30 0" scale="0.05 0.05 0.05" color="#f5deb3"></a-cylinder>

      <!-- 木 -->
      <a-cylinder position="-0.5 1 -1.5" scale="0.08 0.5 0.08" color="#8e6b43"></a-cylinder>
      <a-cone position="-0.5 1.15 -1.5" scale="0.25 0.25 0.25" color="#445936" ></a-cone>
      <a-cone position="-0.5 1.3 -1.5" scale="0.2 0.2 0.2" color="#547240" ></a-cone>

      <!-- シマエナガ -->
      <a-entity position="-1 0 -0.5" rotation="0 -30 0">

　　　<!-- 体 -->
      <a-sphere position="0.5 0.55 -2.5" radius="0.45" color="#FFFFFF"></a-sphere>

　　　<!-- 左目 -->
      <a-sphere position="0.36 0.68 -2.10" radius="0.035" color="#222222"></a-sphere>

      <!-- 右目 -->
      <a-sphere position="0.64 0.68 -2.10" radius="0.035" color="#222222"></a-sphere>

       <!-- くちばし -->
      <a-cone position="0.5 0.59 -2.04" radius-bottom="0.08" radius-top="0" height="0.10" rotation="90 0 0" color="#555758"></a-cone>          
      
      <!-- 左側のほっぺ -->
      <a-sphere position="0.22 0.6 -2.15" radius="0.05" scale="1 1 0.3" rotation="0 -30 0" color="#F8C9B5"></a-sphere>
      
      <!-- 右側のほっぺ -->
      <a-sphere position="0.78 0.6 -2.15" radius="0.05" scale="1 1 0.3" rotation="0 30 0" color="#F8C9B5"></a-sphere>

      <!-- 左側の羽 -->
      <a-sphere position="0.10 0.35 -2.45" radius="0.2" scale="0.5 1.0 0.5" rotation="0 0 25" color="#545c63"></a-sphere>
      
      <!-- 右側の羽 -->
      <a-sphere position="0.9 0.35 -2.45" radius="0.2" scale="0.5 1.0 0.5" rotation="0 0 -25" color="#545c63"></a-sphere>
      </a-entity>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
